<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEIC decode bench</title>
    <style>
        body { font: 14px/1.45 system-ui, sans-serif; margin: 0; padding: 16px; color: #111827; background: #f9fafb; }
        h1 { font-size: 18px; margin: 0 0 4px; }
        p { margin: 0 0 12px; color: #4b5563; }
        .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
        button, label.btn { font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; min-height: 44px; }
        button.primary, label.btn { background: #2563eb; color: #fff; border-color: #2563eb; }
        button:disabled { opacity: 0.5; }
        #caps { font-size: 13px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }
        .file { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px; margin-bottom: 12px; }
        .file h2 { font-size: 14px; margin: 0 0 6px; word-break: break-all; }
        table { border-collapse: collapse; width: 100%; font-size: 13px; }
        th, td { text-align: left; padding: 4px 6px; border-top: 1px solid #f3f4f6; vertical-align: top; }
        td.num { font-variant-numeric: tabular-nums; }
        .err { color: #b91c1c; }
        .ok { color: #15803d; }
        .previews { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .previews figure { margin: 0; width: min(31%, 240px); }
        .previews img { width: 100%; display: block; border-radius: 6px; background: #e5e7eb; }
        .previews figcaption { font-size: 12px; color: #6b7280; }
        .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 2px; border: 1px solid rgba(0,0,0,.15); }
        #status { color: #6b7280; }
    </style>
</head>
<body>
    <h1>HEIC decode bench</h1>
    <p>Runs every decode path this browser has on the same files: times, output size and colour at five points (paths should agree within a few levels). Nothing is uploaded.</p>
    <div id="caps">Checking what this browser supports…</div>
    <div class="bar">
        <label class="btn">Choose photos<input id="pick" type="file" accept="image/*,.heic,.heif" multiple hidden></label>
        <button id="fixtures">Run test fixtures</button>
        <button id="copy" disabled>Copy results</button>
        <span id="status"></span>
    </div>
    <div id="out"></div>

    <script type="module">
        import { createEngine } from './js/img/decode.js';
        import { isHeif } from './js/img/heif.js';

        const engine = createEngine();
        const out = document.getElementById('out');
        const status = document.getElementById('status');
        const results = [];
        let caps = null;

        const ms = (v) => (v == null ? '–' : `${Math.round(v)} ms`);
        const swatch = (rgb) => `<span class="sw" style="background:rgb(${rgb.join(',')})"></span>${rgb.join(',')}`;
        const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        async function showCaps() {
            caps = await engine.capabilities();
            const secure = window.isSecureContext;
            document.getElementById('caps').innerHTML = [
                `Secure context: <b>${secure ? 'yes' : 'no — WebCodecs needs HTTPS or localhost'}</b>`,
                `WebCodecs VideoDecoder: <b>${caps.videoDecoder ? 'yes' : 'no'}</b>`,
                `Cores: <b>${navigator.hardwareConcurrency || '?'}</b>`,
                `Memory: <b>${navigator.deviceMemory ? navigator.deviceMemory + ' GB' : '?'}</b>`,
                `Encode WebP/AVIF: <b>${caps.webp ? 'yes' : 'no'}/${caps.avif ? 'yes' : 'no'}</b>`,
                `<span title="${esc(navigator.userAgent)}">${esc(navigator.userAgent.replace(/^Mozilla\/5\.0 /, '').slice(0, 90))}</span>`,
            ].join(' · ');
        }

        async function runFile(file, expected = null) {
            const box = document.createElement('section');
            box.className = 'file';
            box.innerHTML = `<h2>${esc(file.name)} · ${(file.size / 1048576).toFixed(2)} MB</h2><table><thead><tr><th>Path</th><th>Result</th><th>Parse</th><th>Thumbnail</th><th>Full decode</th><th>Size</th><th>Colours</th></tr></thead><tbody></tbody></table><div class="previews"></div>`;
            out.prepend(box);
            const heif = isHeif(new Uint8Array(await file.slice(0, 64).arrayBuffer()));
            const paths = heif ? ['native', 'webcodecs', 'wasm'] : ['native'];
            const entry = { file: file.name, size: file.size, runs: [] };
            results.push(entry);
            for (const path of paths) {
                status.textContent = `${file.name}: ${path}…`;
                const r = await engine.bench(file, path);
                entry.runs.push({ ...r, preview: undefined });
                let check = '';
                if (r.ok && expected) {
                    const sizeOk = r.width === expected.width && r.height === expected.height;
                    const pts = [r.samples[0], r.samples[1], r.samples[3], r.samples[4]];
                    const worst = Math.max(...pts.flatMap((p, i) => p.map((v, k) => Math.abs(v - expected.points[i].rgb[k]))));
                    check = ` · <span class="${sizeOk && worst <= 12 ? 'ok' : 'err'}">${sizeOk ? 'size ok' : 'size wrong'}, max colour diff ${worst}</span>`;
                    entry.runs.at(-1).check = { sizeOk, worst };
                }
                const row = document.createElement('tr');
                row.innerHTML = `<td>${path}</td><td class="${r.ok ? 'ok' : 'err'}">${r.ok ? 'ok' : esc(r.error)}${check}</td>
                    <td class="num">${ms(r.parseMs)}</td><td class="num">${ms(r.thumbMs)}</td><td class="num">${r.ok ? ms(r.decodeMs) : '–'}</td>
                    <td class="num">${r.ok ? `${r.width}×${r.height}` : ''}</td><td>${r.ok ? r.samples.map(swatch).join(' ') : ''}</td>`;
                box.querySelector('tbody').append(row);
                if (r.ok) {
                    const fig = document.createElement('figure');
                    fig.innerHTML = `<img src="${URL.createObjectURL(r.preview)}" alt=""><figcaption>${path} · ${ms(r.decodeMs)}${r.tiles ? ' · ' + r.tiles : ''}</figcaption>`;
                    box.querySelector('.previews').append(fig);
                }
            }
            status.textContent = '';
            document.getElementById('copy').disabled = false;
        }

        async function runAll(files, expected = {}) {
            for (const f of files) await runFile(f, expected[f.name]);
        }

        document.getElementById('pick').addEventListener('change', (e) => runAll([...e.target.files]));
        document.getElementById('fixtures').addEventListener('click', async () => {
            const expected = await (await fetch('tests/fixtures/expected.json')).json();
            const files = await Promise.all(Object.keys(expected).map(async (name) => {
                const blob = await (await fetch(`tests/fixtures/${name}`)).blob();
                return new File([blob], name, { type: 'image/heic' });
            }));
            await runAll(files, expected);
        });
        document.getElementById('copy').addEventListener('click', async () => {
            const report = JSON.stringify({ userAgent: navigator.userAgent, cores: navigator.hardwareConcurrency, memory: navigator.deviceMemory, caps, results }, (k, v) => (typeof v === 'number' ? Math.round(v * 10) / 10 : v), 1);
            try {
                await navigator.clipboard.writeText(report);
                status.textContent = 'Copied';
            } catch {
                const area = document.createElement('textarea');
                area.value = report;
                area.style.cssText = 'width:100%;height:200px';
                out.prepend(area);
                area.select();
                status.textContent = 'Select and copy the text above';
            }
        });
        showCaps();
    </script>
</body>
</html>
